name: Hourly AI Brain Training

on:
  schedule:
    - cron: '30 * * * *'   # Every hour at :30
  push:
    branches: [ main ]     # ← ALSO runs on every commit (fixes your issue)
  workflow_dispatch:       # Manual run button

jobs:
  train-ai-brain:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repo
      uses: actions/checkout@v3

    - name: Setup Python 3.10
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: pip install -r requirements.txt

    - name: Train AI Brain
      run: python train_model.py

    - name: Commit updated brain
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add market_predictor.tflite
        git diff --staged --quiet || git commit -m "Auto: Updated AI brain [skip ci]"
        git push
