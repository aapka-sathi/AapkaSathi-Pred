name: Hourly Autonomous LSTM Training

on:
  schedule:
    # This standard cron syntax runs the server at minute 30 of every single hour, 24/7.
    # This guarantees the model is freshly trained within 1 hour of ANY market's dynamic closing time.
    - cron: '30 * * * *'
  workflow_dispatch: # This allows you to click a button to run it manually anytime!

jobs:
  train-ai-brain:
    runs-on: ubuntu-latest

    steps:
    - name: 📥 Download Repository
      uses: actions/checkout@v3

    - name: ⚙️ Boot up Python Engine
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: 📦 Install AI Libraries
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: 🧠 Run Live Market Training (Yahoo API)
      run: |
        python train_model.py

    - name: 🚀 Push New Brain to App
      run: |
        git config --global user.name "AapkaSathi Cloud Bot"
        git config --global user.email "bot@aapkasathi.com"
        git add market_predictor.tflite
        # If the file changed, commit and push it. If the market was closed and nothing changed, exit cleanly.
        git commit -m "Auto-Update: Fresh LSTM Brain via Live Yahoo Data" || exit 0
        git push
